name: 🛡️ C5ISR CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ═══════════════════════════════════════════════
  #  BACKEND — Lint & Type Check
  # ═══════════════════════════════════════════════
  backend-lint:
    name: 🐍 Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check . --output-format=github

  # ═══════════════════════════════════════════════
  #  BACKEND — Import & Startup Check
  # ═══════════════════════════════════════════════
  backend-check:
    name: 🔧 Backend Startup Check
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify Identity Service imports
        working-directory: backend
        run: python -c "from identity.main import app; print('Identity Service: OK')"

      - name: Verify Gateway Service imports
        working-directory: backend
        run: python -c "from gateway.main import app; print('Gateway Service: OK')"

      - name: Verify Policy Engine imports
        working-directory: backend
        run: python -c "from identity.policy_engine import router; print('Policy Engine: OK')"

      - name: Verify Shared Models imports
        working-directory: backend
        run: python -c "from shared.models import User, UserRole, ClearanceLevel; print('Shared Models: OK')"

  # ═══════════════════════════════════════════════
  #  FRONTEND — Lint & Type Check
  # ═══════════════════════════════════════════════
  frontend-lint:
    name: ⚛️ Frontend Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  # ═══════════════════════════════════════════════
  #  FRONTEND — Build
  # ═══════════════════════════════════════════════
  frontend-build:
    name: 📦 Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ═══════════════════════════════════════════════
  #  DOCKER — Build Validation
  # ═══════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Identity Service image
        run: docker build -f backend/identity/Dockerfile -t c5isr-identity backend/

      - name: Build Gateway Service image
        run: docker build -f backend/gateway/Dockerfile -t c5isr-gateway backend/

      - name: Build Defense Service image
        run: docker build -f backend/defense/Dockerfile -t c5isr-defense backend/

      - name: Build Simulation Service image
        run: docker build -f backend/simulation/Dockerfile -t c5isr-simulation backend/

      - name: Verify images
        run: |
          docker images | grep c5isr
          echo "All Docker images built successfully ✅"

  # ═══════════════════════════════════════════════
  #  SECURITY — Dependency Audit
  # ═══════════════════════════════════════════════
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: NPM Audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pip Audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
