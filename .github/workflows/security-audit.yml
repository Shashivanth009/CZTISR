name: 🔒 Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  dependency-audit:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python Dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          echo "## 🐍 Python Dependency Audit" >> $GITHUB_STEP_SUMMARY
          pip-audit -r backend/requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1 || true

      # Node.js Dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Audit NPM dependencies
        working-directory: frontend
        run: |
          npm ci
          echo "## ⚛️ NPM Dependency Audit" >> $GITHUB_STEP_SUMMARY
          npm audit --format json | head -100 >> $GITHUB_STEP_SUMMARY 2>&1 || true

  docker-scan:
    name: 🐳 Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Identity Service image
        run: docker build -f backend/identity/Dockerfile -t c5isr-identity:scan backend/

      - name: Build Gateway Service image
        run: docker build -f backend/gateway/Dockerfile -t c5isr-gateway:scan backend/

      - name: Scan Identity Service (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'c5isr-identity:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Scan Gateway Service (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'c5isr-gateway:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  secrets-scan:
    name: 🔑 Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true
