<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8">
  <defs>
    <linearGradient id="sepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00ff9d;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#00d9f9;stop-opacity:0.8"/>
      <stop offset="80%" style="stop-color:#ff2a6d;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ff2a6d;stop-opacity:0"/>
    </linearGradient>
    <filter id="glowSep" x="-5%" y="-100%" width="110%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="4" x2="1200" y2="4" stroke="url(#sepGrad)" stroke-width="1" filter="url(#glowSep)"/>
  <!-- Animated pulse dot -->
  <circle r="3" cy="4" fill="#00d9f9" opacity="0.8">
    <animate attributeName="cx" values="0;1200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
