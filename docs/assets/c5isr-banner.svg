<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d"/>
      <stop offset="50%" style="stop-color:#00d9f9"/>
      <stop offset="100%" style="stop-color:#00ff9d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2a6d"/>
      <stop offset="100%" style="stop-color:#ff2a6d;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff9d;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff9d;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00ff9d;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Clip for radar -->
    <clipPath id="radarClip">
      <circle cx="600" cy="150" r="120"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  
  <!-- Scanline Effect -->
  <rect width="1200" height="4" fill="url(#scanLine)" y="0">
    <animate attributeName="y" values="-4;300" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner Decorations -->
  <!-- Top Left -->
  <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#00ff9d" stroke-width="2" opacity="0.6"/>
  <path d="M 0 60 L 0 0 L 60 0" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.3"/>
  <!-- Top Right -->
  <path d="M 1170 0 L 1200 0 L 1200 30" fill="none" stroke="#00ff9d" stroke-width="2" opacity="0.6"/>
  <path d="M 1140 0 L 1200 0 L 1200 60" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.3"/>
  <!-- Bottom Left -->
  <path d="M 0 270 L 0 300 L 30 300" fill="none" stroke="#00d9f9" stroke-width="2" opacity="0.6"/>
  <!-- Bottom Right -->
  <path d="M 1200 270 L 1200 300 L 1170 300" fill="none" stroke="#00d9f9" stroke-width="2" opacity="0.6"/>

  <!-- Radar Circles -->
  <circle cx="600" cy="150" r="40" fill="none" stroke="#00ff9d" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="40;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="150" r="40" fill="none" stroke="#00d9f9" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="40;120" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="150" r="40" fill="none" stroke="#ff2a6d" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="40;120" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Horizontal Lines -->
  <line x1="50" y1="70" x2="350" y2="70" stroke="#00ff9d" stroke-width="1" opacity="0.3"/>
  <line x1="850" y1="70" x2="1150" y2="70" stroke="#00ff9d" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="230" x2="350" y2="230" stroke="#00d9f9" stroke-width="1" opacity="0.3"/>
  <line x1="850" y1="230" x2="1150" y2="230" stroke="#00d9f9" stroke-width="1" opacity="0.3"/>

  <!-- Shield Icon -->
  <g transform="translate(540, 75)" filter="url(#glowStrong)">
    <path d="M 60 0 L 110 20 L 110 60 C 110 90 60 115 60 115 C 60 115 10 90 10 60 L 10 20 Z" 
          fill="none" stroke="#00ff9d" stroke-width="2.5"/>
    <path d="M 60 25 L 60 85 M 40 55 L 80 55" stroke="#00ff9d" stroke-width="2"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="url(#neonGrad)" filter="url(#glowStrong)" letter-spacing="12">
    C5ISR
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#00d9f9" filter="url(#glow)" letter-spacing="8" opacity="0.9">
    ZERO TRUST PLATFORM
  </text>

  <!-- Tagline -->
  <text x="600" y="220" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" letter-spacing="4">
    MILITARY-GRADE COMMAND &amp; CONTROL • NIST SP 800-207
  </text>

  <!-- Status Indicators -->
  <!-- Left Side -->
  <g transform="translate(80, 90)" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8">
    <circle cx="0" cy="-3" r="3" fill="#00ff9d" filter="url(#glowSoft)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="0">IDENTITY SERVICE</text>
    
    <circle cx="0" cy="17" r="3" fill="#00ff9d" filter="url(#glowSoft)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="20">GATEWAY SERVICE</text>
    
    <circle cx="0" cy="37" r="3" fill="#00ff9d" filter="url(#glowSoft)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="40">POLICY ENGINE</text>

    <circle cx="0" cy="57" r="3" fill="#00d9f9" filter="url(#glowSoft)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="60">SIMULATION</text>

    <circle cx="0" cy="77" r="3" fill="#fcee0a" filter="url(#glowSoft)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="80">THREAT LEVEL: ELEVATED</text>
  </g>

  <!-- Right Side -->
  <g transform="translate(950, 90)" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" text-anchor="end">
    <text x="160" y="0">AES-256-GCM</text>
    <rect x="170" y="-8" width="30" height="12" rx="2" fill="none" stroke="#00ff9d" stroke-width="0.5"/>
    <text x="185" y="0" text-anchor="middle" fill="#00ff9d" font-size="7">ACTIVE</text>
    
    <text x="160" y="20">mTLS 1.3</text>
    <rect x="170" y="12" width="30" height="12" rx="2" fill="none" stroke="#00ff9d" stroke-width="0.5"/>
    <text x="185" y="20" text-anchor="middle" fill="#00ff9d" font-size="7">ACTIVE</text>
    
    <text x="160" y="40">TOTP MFA</text>
    <rect x="170" y="32" width="30" height="12" rx="2" fill="none" stroke="#00ff9d" stroke-width="0.5"/>
    <text x="185" y="40" text-anchor="middle" fill="#00ff9d" font-size="7">ARMED</text>

    <text x="160" y="60">BELL-LAPADULA</text>
    <rect x="170" y="52" width="30" height="12" rx="2" fill="none" stroke="#00d9f9" stroke-width="0.5"/>
    <text x="185" y="60" text-anchor="middle" fill="#00d9f9" font-size="7">ARMED</text>

    <text x="160" y="80">DEFCON 3</text>
    <rect x="170" y="72" width="30" height="12" rx="2" fill="none" stroke="#ff2a6d" stroke-width="0.5"/>
    <text x="185" y="80" text-anchor="middle" fill="#ff2a6d" font-size="7">ALERT</text>
  </g>

  <!-- Animated Dots (particles) -->
  <circle r="1.5" fill="#00ff9d" opacity="0.6">
    <animate attributeName="cx" values="100;500;900;100" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;200;80;50" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0;0.6;0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle r="1" fill="#00d9f9" opacity="0.4">
    <animate attributeName="cx" values="1100;700;300;1100" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="250;100;220;250" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0;0.4;0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#ff2a6d" opacity="0.3">
    <animate attributeName="cx" values="300;800;200;300" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;50;250;150" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0;0.3;0" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom Line with animation -->
  <line x1="0" y1="298" x2="1200" y2="298" stroke="url(#neonGrad)" stroke-width="2" opacity="0.5"/>
  <rect width="200" height="2" fill="#00ff9d" y="298" opacity="0.8">
    <animate attributeName="x" values="-200;1200" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Line with animation -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#neonGrad)" stroke-width="2" opacity="0.5"/>
  <rect width="200" height="2" fill="#00d9f9" y="0" opacity="0.8">
    <animate attributeName="x" values="1200;-200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
