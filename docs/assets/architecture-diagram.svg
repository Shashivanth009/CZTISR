<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d"/>
      <stop offset="100%" style="stop-color:#00d9f9"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.3" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)"/>
  <rect width="900" height="600" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#00ff9d" filter="url(#g)" letter-spacing="6" font-weight="bold">C5ISR ZERO TRUST — SYSTEM ARCHITECTURE</text>
  <line x1="100" y1="48" x2="800" y2="48" stroke="#00ff9d" stroke-width="0.5" opacity="0.3"/>

  <!-- CLIENT LAYER -->
  <rect x="300" y="60" width="300" height="60" rx="6" fill="none" stroke="#00d9f9" stroke-width="1.5" opacity="0.8"/>
  <text x="450" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#00d9f9" font-weight="bold">🖥️ CLIENT LAYER</text>
  <text x="450" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#94a3b8">React 19 • TypeScript • Vite 7 • Tailwind</text>
  <text x="450" y="110" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#4b5563">11 Components • 9 Tabs • RBAC UI • GlassExpand</text>

  <!-- Connection Lines -->
  <line x1="400" y1="120" x2="400" y2="170" stroke="#00d9f9" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="385" y="148" font-family="'Courier New', monospace" font-size="7" fill="#00d9f9">HTTPS</text>
  <line x1="500" y1="120" x2="500" y2="170" stroke="#ff2a6d" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="508" y="148" font-family="'Courier New', monospace" font-size="7" fill="#ff2a6d">WSS</text>

  <!-- ENFORCEMENT LAYER (PEP) -->
  <rect x="150" y="170" width="600" height="110" rx="6" fill="none" stroke="#00ff9d" stroke-width="1.5" opacity="0.8"/>
  <text x="450" y="188" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#00ff9d" font-weight="bold">🛡️ ENFORCEMENT LAYER — Policy Enforcement Point (PEP)</text>
  
  <!-- Gateway Box -->
  <rect x="170" y="200" width="170" height="65" rx="4" fill="#00ff9d" fill-opacity="0.05" stroke="#00ff9d" stroke-width="0.8"/>
  <text x="255" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00ff9d" font-weight="bold">Gateway Service</text>
  <text x="255" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">FastAPI • JWT Validation</text>
  <text x="255" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">16 REST Endpoints</text>
  <text x="255" y="256" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Port: 8020</text>

  <!-- WebSocket Box -->
  <rect x="360" y="200" width="170" height="65" rx="4" fill="#ff2a6d" fill-opacity="0.05" stroke="#ff2a6d" stroke-width="0.8"/>
  <text x="445" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#ff2a6d" font-weight="bold">WebSocket Server</text>
  <text x="445" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">/ws/telemetry</text>
  <text x="445" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">13 Assets @ 1Hz</text>
  <text x="445" y="256" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Land(6) Air(4) Naval(3)</text>

  <!-- Simulator Box -->
  <rect x="550" y="200" width="180" height="65" rx="4" fill="#fcee0a" fill-opacity="0.05" stroke="#fcee0a" stroke-width="0.8"/>
  <text x="640" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#fcee0a" font-weight="bold">Embedded Simulator</text>
  <text x="640" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Asset Physics Engine</text>
  <text x="640" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Traffic Generator</text>
  <text x="640" y="256" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">90% Valid / 10% Threats</text>

  <!-- Connection to Control Plane -->
  <line x1="350" y1="280" x2="350" y2="320" stroke="#00ff9d" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="355" y="305" font-family="'Courier New', monospace" font-size="7" fill="#00ff9d">Token Verify</text>

  <!-- CONTROL PLANE (PDP) -->
  <rect x="150" y="320" width="600" height="110" rx="6" fill="none" stroke="#ff2a6d" stroke-width="1.5" opacity="0.8"/>
  <text x="450" y="338" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#ff2a6d" font-weight="bold">🔑 CONTROL PLANE — Policy Decision Point (PDP)</text>

  <!-- Identity Box -->
  <rect x="170" y="350" width="270" height="65" rx="4" fill="#ff2a6d" fill-opacity="0.05" stroke="#ff2a6d" stroke-width="0.8"/>
  <text x="305" y="368" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#ff2a6d" font-weight="bold">Identity Service</text>
  <text x="305" y="382" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">3-Step Auth: Creds → Trust → TOTP MFA</text>
  <text x="305" y="394" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">JWT (HS256, 30min) • bcrypt • pyotp</text>
  <text x="305" y="406" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Port: 8001 • Lockout: 5 attempts/300s</text>

  <!-- Policy Engine Box -->
  <rect x="460" y="350" width="270" height="65" rx="4" fill="#00d9f9" fill-opacity="0.05" stroke="#00d9f9" stroke-width="0.8"/>
  <text x="595" y="368" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00d9f9" font-weight="bold">Policy Engine</text>
  <text x="595" y="382" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Bell-LaPadula (No Read Up)</text>
  <text x="595" y="394" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">RBAC: 4 Roles × 9 Resources</text>
  <text x="595" y="406" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Trust Score: 0-100 (4 factors)</text>

  <!-- Connection to Data Layer -->
  <line x1="350" y1="430" x2="350" y2="470" stroke="#ff2a6d" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="550" y1="430" x2="550" y2="470" stroke="#ff2a6d" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- DATA LAYER -->
  <rect x="150" y="470" width="600" height="80" rx="6" fill="none" stroke="#fcee0a" stroke-width="1.5" opacity="0.8"/>
  <text x="450" y="488" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#fcee0a" font-weight="bold">💾 DATA LAYER</text>

  <!-- PostgreSQL -->
  <rect x="190" y="500" width="230" height="35" rx="4" fill="#fcee0a" fill-opacity="0.05" stroke="#fcee0a" stroke-width="0.8"/>
  <text x="305" y="516" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#fcee0a" font-weight="bold">🗄️ PostgreSQL 15</text>
  <text x="305" y="528" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Users • Roles • Policies • Sessions</text>

  <!-- Redis -->
  <rect x="480" y="500" width="230" height="35" rx="4" fill="#ff2a6d" fill-opacity="0.05" stroke="#ff2a6d" stroke-width="0.8"/>
  <text x="595" y="516" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#ff2a6d" font-weight="bold">⚡ Redis 7</text>
  <text x="595" y="528" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Sessions • Pub/Sub Telemetry</text>

  <!-- Legend -->
  <rect x="20" y="470" width="110" height="80" rx="4" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  <text x="75" y="486" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8" font-weight="bold">LEGEND</text>
  <line x1="30" y1="496" x2="50" y2="496" stroke="#00ff9d" stroke-width="1.5"/>
  <text x="55" y="499" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">PEP</text>
  <line x1="30" y1="510" x2="50" y2="510" stroke="#ff2a6d" stroke-width="1.5"/>
  <text x="55" y="513" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">PDP</text>
  <line x1="30" y1="524" x2="50" y2="524" stroke="#fcee0a" stroke-width="1.5"/>
  <text x="55" y="527" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Data</text>
  <line x1="30" y1="538" x2="50" y2="538" stroke="#00d9f9" stroke-width="1.5"/>
  <text x="55" y="541" font-family="'Courier New', monospace" font-size="7" fill="#94a3b8">Client</text>

  <!-- NIST Reference -->
  <text x="450" y="575" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#4b5563">Based on NIST SP 800-207 Zero Trust Architecture</text>
  <text x="450" y="590" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#4b5563">PEP = Policy Enforcement Point • PDP = Policy Decision Point</text>

  <!-- Animated pulse on borders -->
  <rect x="148" y="168" width="604" height="114" rx="6" fill="none" stroke="#00ff9d" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="148" y="318" width="604" height="114" rx="6" fill="none" stroke="#ff2a6d" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="148" y="468" width="604" height="84" rx="6" fill="none" stroke="#fcee0a" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" begin="2s" repeatCount="indefinite"/>
  </rect>
</svg>
