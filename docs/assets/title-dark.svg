<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 100" width="700" height="100">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d"/>
      <stop offset="40%" style="stop-color:#00d9f9"/>
      <stop offset="70%" style="stop-color:#00ff9d"/>
      <stop offset="100%" style="stop-color:#00d9f9"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <text x="350" y="45" text-anchor="middle" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="10">
    C5ISR ZERO TRUST
  </text>
  <text x="350" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8" letter-spacing="6" opacity="0.8">
    MILITARY-GRADE COMMAND &amp; CONTROL PLATFORM
  </text>
  
  <!-- Underline animation -->
  <line x1="100" y1="85" x2="600" y2="85" stroke="#1e293b" stroke-width="1"/>
  <line x1="100" y1="85" x2="200" y2="85" stroke="url(#titleGrad)" stroke-width="2">
    <animate attributeName="x1" values="100;500;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="200;600;200" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
