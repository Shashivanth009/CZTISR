<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d"/>
      <stop offset="50%" style="stop-color:#00d9f9"/>
      <stop offset="100%" style="stop-color:#00ff9d"/>
    </linearGradient>
    <filter id="footGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(165, 8)" filter="url(#footGlow)">
    <path d="M 20 0 L 38 8 L 38 22 C 38 34 20 42 20 42 C 20 42 2 34 2 22 L 2 8 Z" 
          fill="none" stroke="url(#footGrad)" stroke-width="1.5"/>
    <path d="M 20 10 L 20 30 M 12 20 L 28 20" stroke="url(#footGrad)" stroke-width="1.2"/>
  </g>

  <!-- C5ISR Text -->
  <text x="220" y="32" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="url(#footGrad)" filter="url(#footGlow)" letter-spacing="4">
    C5ISR
  </text>

  <!-- Zero Trust Text -->
  <text x="200" y="52" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" letter-spacing="5">
    ZERO TRUST PLATFORM
  </text>

  <!-- Bottom Line -->
  <line x1="50" y1="65" x2="350" y2="65" stroke="url(#footGrad)" stroke-width="0.5" opacity="0.4"/>
  <text x="200" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#4b5563" letter-spacing="2">
    NEVER TRUST • ALWAYS VERIFY
  </text>
</svg>
